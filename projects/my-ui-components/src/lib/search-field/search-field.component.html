<mat-form-field appearance="outline">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput($event)" />
  <mat-icon matPrefix>search</mat-icon>
  <button
    *ngIf="value"
    matSuffix
    mat-icon-button
    aria-label="Clear"
    (click)="clear()">
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
